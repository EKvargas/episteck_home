[project]
name = "knowledge-technology-gate-spike"
version = "0.0.0"
requires-python = ">=3.11"
# EXPERIMENTAL SPIKE ONLY. Not a production package; never published; not referenced
# by apps/, packages/, or services/. See README.md.
dependencies = [
    "cryptography>=43",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["scenarios", "corpus", "backends", "r13"]
