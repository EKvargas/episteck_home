# nginx reverse proxy for the Episteck Home BFF (G1.6), Nuremberg EU node.
#
# Install to: /etc/nginx/sites-available/home-bff.conf  (symlink into sites-enabled)
# Certificate: sudo certbot --nginx -d bff.home.episteck.com
#
# LOGGING
# nginx logs the full request line by default, which on /callback means the OAuth
# authorization code and state land in a plaintext file on disk. The log_format below
# logs $uri (the PATH only) instead of $request. It MUST live in the http{} context,
# so it ships as conf.d/episteck-log-format.conf rather than in this server file.
#
# WHY A PROXY AT ALL
# The browser must reach the BFF over HTTPS for the OAuth callback and for the
# Secure cookie to be retained. The application port (9933) stays on loopback and
# is never published publicly.

server {
    listen 80;
    listen [::]:80;
    server_name bff.home.episteck.com;
    # certbot writes its challenge location here; everything else goes to TLS.
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bff.home.episteck.com;

    ssl_certificate     /etc/letsencrypt/live/bff.home.episteck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bff.home.episteck.com/privkey.pem;

    # The BFF holds OAuth tokens. Do not let a browser cache any of its responses.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # episteck_noqs: path only, never the query string (see conf.d) — the OAuth
    # code and state on /callback (and any other query string on any other
    # route) must never reach a plaintext access log. This is a SERVER-level
    # directive so it covers every route in this block by default, including
    # the final 404 catch-all. Do not add a location-level access_log — nginx
    # lets a location override this, and a per-location override is exactly
    # how a route can silently regress to the http-level default log format.
    access_log /var/log/nginx/home-bff-access.log episteck_noqs;

    # Explicit allowlist (§11). Anything not listed here falls through to the
    # generic `location /` 404 at the bottom — this closes B5 (previously the
    # catch-all made every route, including /docs and /bootstrap, publicly
    # reachable by construction).

    # /delegation is for the trusted runtime on this host only. It must never be
    # reachable from the public Internet, even with a valid cookie.
    location = /delegation {
        deny all;
        return 404;
    }

    location = /login {
        proxy_pass http://127.0.0.1:9933;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /callback {
        proxy_pass http://127.0.0.1:9933;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:9933;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /logout {
        proxy_pass http://127.0.0.1:9933;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /session {
        proxy_pass http://127.0.0.1:9933;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /whoami {
        proxy_pass http://127.0.0.1:9933;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Reserved for the future Home Hub listener (F2b, not activated here).
    # `^~ /app/` (not `^~ /app`) so `/application` is never matched by this block.
    location = /app {
        proxy_pass http://127.0.0.1:9940;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /app/ {
        proxy_pass http://127.0.0.1:9940;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /bootstrap, /docs, /redoc, /openapi.json, and everything else: 404. The
    # Next.js server reaches /bootstrap over loopback directly, never via nginx.
    location / {
        return 404;
    }

    error_log  /var/log/nginx/home-bff-error.log;
}
