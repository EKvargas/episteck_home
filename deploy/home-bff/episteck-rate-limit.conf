# Install to: /etc/nginx/conf.d/episteck-rate-limit.conf
#
# Must be in the http{} context (like episteck-log-format.conf): limit_req_zone inside a
# server block is a configuration error. nginx.conf includes conf.d/*.conf before
# sites-enabled/*, so the vhost can reference the zone.
#
# finance_callback: the public Olin Finance PSD2 redirect (ADR-0013). A real consent sends
# one request per SCA; 10 per minute per client address with a burst of 5 leaves room for a
# reload or a second bank, and turns a scan into 429s. Keyed on $binary_remote_addr: DNS
# points straight at this node and no proxy sits in front, so it is the client address.
# 1 MB holds about 16,000 addresses.
limit_req_zone $binary_remote_addr zone=finance_callback:1m rate=10r/m;
