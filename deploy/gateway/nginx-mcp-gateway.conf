# Standalone nginx instance for the Home Agent MCP delegation gateway (G1.6).
# This file is not included by public nginx. The service runs as
# svc-home-gateway with episteck-gw supplementary access.

pid /run/episteck-mcp-gateway/nginx.pid;

events {
    worker_connections 256;
}

http {
    log_format gateway_safe '$remote_addr [$time_local] '
                            '"$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent';
    access_log /var/lib/episteck-mcp-gateway/access.log gateway_safe;
    error_log  /var/lib/episteck-mcp-gateway/error.log warn;
    client_body_temp_path /run/episteck-mcp-gateway/client_body;
    proxy_temp_path /run/episteck-mcp-gateway/proxy;
    fastcgi_temp_path /run/episteck-mcp-gateway/fastcgi;
    uwsgi_temp_path /run/episteck-mcp-gateway/uwsgi;
    scgi_temp_path /run/episteck-mcp-gateway/scgi;

    server {
        listen 127.0.0.1:9934;
        server_name _;

        location = /__mint {
            internal;
            proxy_pass http://unix:/run/episteck/home-bff-mint/mint.sock:/internal/mint;
            proxy_method POST;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host "home-bff-mint";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Episteck-Delegation "";
            proxy_set_header X-Actor-ID "";
            proxy_set_header X-Runtime-ID "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;
        }

        location /gateway/home/ {
            auth_request /__mint;
            auth_request_set $mint_delegation $upstream_http_x_episteck_delegation;
            proxy_pass http://127.0.0.1:9932/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Episteck-Delegation $mint_delegation;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Mcp-Session-Id $http_mcp_session_id;
            proxy_hide_header X-Episteck-Delegation;
            proxy_set_header Connection "";
            proxy_pass_request_body on;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /gateway/nutrition/ {
            auth_request /__mint;
            auth_request_set $mint_delegation $upstream_http_x_episteck_delegation;
            proxy_pass http://127.0.0.1:9931/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Episteck-Delegation $mint_delegation;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Mcp-Session-Id $http_mcp_session_id;
            proxy_hide_header X-Episteck-Delegation;
            proxy_set_header Connection "";
            proxy_pass_request_body on;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
