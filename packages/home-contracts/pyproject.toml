[project]
name = "episteck-home-contracts"
version = "0.1.0"
description = "Knowledge authorization wire and ContextBundle contracts for Episteck Home"
requires-python = ">=3.11"
dependencies = ["rfc8785==0.1.4"]

[build-system]
requires = ["setuptools>=68"]
