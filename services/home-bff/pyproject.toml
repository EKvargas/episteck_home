[project]
name = "episteck-home-bff"
version = "0.2.0"
description = "Confidential OAuth Backend-for-Frontend and session boundary for Episteck Home (EU node)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["home_bff*"]
