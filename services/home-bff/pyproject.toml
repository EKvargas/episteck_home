[project]
name = "episteck-home-bff"
version = "0.1.0"
description = "Confidential OAuth Backend-for-Frontend and session boundary for Episteck Home (EU node)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
