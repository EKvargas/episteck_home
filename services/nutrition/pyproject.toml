[project]
name = "episteck-nutrition-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "httpx>=0.27",
    "fastmcp>=2.0",
    "nutrition-domain",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
